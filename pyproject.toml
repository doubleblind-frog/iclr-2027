[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generalised-analogical-reasoning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "boto3",
    "botocore",
    "dspy-ai>=3.2.0",
    "krippendorff",
    "matplotlib",
    "numpy",
    "open_clip_torch",
    "openai",
    "openpyxl",
    "pandas",
    "pillow",
    "pydantic",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "sentence-transformers>=5.4.1",
    "torch",
    "tqdm>=4.67.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
